services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 4to
      POSTGRES_USER: 4to
      POSTGRES_PASSWORD: 4to
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4to -d 4to"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 4to
      MINIO_ROOT_PASSWORD: 4to-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    environment:
      DATABASE_URL: postgresql+psycopg://4to:4to@postgres:5432/4to
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-only-change-in-production
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: 4to
      S3_SECRET_KEY: 4to-secret
      S3_BUCKET: 4to-originals
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ../services/api
    command: celery -A app.workers.tasks.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://4to:4to@postgres:5432/4to
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: 4to
      S3_SECRET_KEY: 4to-secret
      S3_BUCKET: 4to-originals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
